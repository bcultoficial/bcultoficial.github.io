<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCULT Links</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: raw, cercano, de gimnasio, nada de venta
   IDEA ficha de bio con el logo oficial B·CULT
   PICTURE logo oficial blanco con el punto rojo de marca
   COLOUR negro goma, hueso, rojo de marca #9b2424, gris hierro
   TYPE Archivo Black + Archivo
   LAYOUT una columna de 460px: logo arriba, enlaces grandes debajo */
:root{color-scheme:dark;--bg:#0f0f0e;--ink:#ece6da;--mute:#a8a397;--iron:#2a2926;--edge:#3a3935;--blue:#9b2424;--blue2:#7a1b1b}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;min-height:100svh}
.wrap{max-width:460px;margin:0 auto;padding:28px max(16px,5vw) 40px}
.brand{margin:18px auto 0;width:min(300px,78%)}
.brand img{display:block;width:100%;height:auto}
h1{font:400 clamp(52px,16vw,76px)/.95 "Archivo Black",Impact,sans-serif;letter-spacing:-.02em;margin:0;text-align:center}
.tag{text-align:center;color:var(--mute);margin:8px 0 26px;font-size:16px}
.tag b{color:var(--ink);font-weight:700}
.links{display:grid;gap:12px}
.l{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 16px;border:1px solid var(--edge);border-radius:14px;background:var(--iron);color:var(--ink);text-decoration:none;transition:transform .15s,border-color .15s}
.l:hover{border-color:var(--ink);transform:translateY(-2px)}
.l:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.l svg{flex:none;width:26px;height:26px}
.l .t{flex:1;display:grid}
.l .t strong{font-size:17px;font-weight:700}
.l .t span{font-size:14px;color:var(--mute)}
.l .go{flex:none;font-size:20px;color:var(--mute)}
.l.main{background:var(--blue);border-color:var(--blue);min-height:76px}
.l.main .t span,.l.main .go{color:#f3d9d9}
.l.main:hover{border-color:#fff;background:var(--blue2)}
.l.off{opacity:.5;pointer-events:none}
.sep{margin:22px 0 10px;color:var(--mute);font-size:14px;text-align:center}
.mail{display:block;text-align:center;color:var(--mute);margin-top:26px;font-size:15px}
.mail a{color:var(--ink)}
footer{margin-top:20px;text-align:center;color:#6f6b62;font-size:13px}
@media(prefers-reduced-motion:reduce){.l{transition:none}.l:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
<h1 class="brand"><img src="../logo-bcult.svg" alt="BCULT · Bodybuilding Culture"></h1>
<p class="tag"><b>Raw bodybuilding.</b> Culturismo y cultura de gimnasio, contado como es.</p>

<nav class="links" id="links"></nav>

<p class="mail">¿Algo más? Escríbenos a <a id="mailA" href="mailto:bcult.info@gmail.com">bcult.info@gmail.com</a></p>
<footer>BCULT · Carlos González y Guillem Abela</footer>
</div>

<script>
{
/* ============ CONFIGURACIÓN: pega aquí vuestros enlaces ============
   Si un enlace está vacío (""), el botón sale apagado como "Próximamente". */
const CONFIG = {
  formulario: "https://docs.google.com/forms/d/e/1FAIpQLScyOA4t5DC2wW4_VpJwI2nwDGv_2bOsvx7KzgBWnndlLtrdew/viewform",   // Formulario CORTO de BCULT Team (Google Forms)
  youtube:    "https://www.youtube.com/@bcult.oficial",   // https://www.youtube.com/@...
  instagram:  "https://www.instagram.com/bcult.oficial/",   // https://www.instagram.com/...
  tiktok:     "https://www.tiktok.com/@bcult.raw.bodybui",   // https://www.tiktok.com/@...
  web:        "https://bcultoficial.github.io/"    // Vuestra web (cuando esté publicada)
};
/* =================================================================== */

const ic = {
  form:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3h10v18H7z"/><path d="M10 8h4M10 12h4M10 16h2"/></svg>',
  yt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .6 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM9.7 15.1V8.9l5.8 3.1z"/></svg>',
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  tt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.4 2.2 1.8 3.7 4 3.9v3.2a7.6 7.6 0 0 1-4-1.2v6.3A6 6 0 1 1 10.4 9v3.3a2.8 2.8 0 1 0 2 2.7V3z"/></svg>',
  web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>'
};

const items = [
  {k:'formulario', icon:'form', t:'Quiero entrenar con BCULT Team', s:'Formulario corto · 2-3 minutos', main:true},
  {sep:'Síguenos'},
  {k:'youtube', icon:'yt', t:'YouTube', s:'Entrevistas, entrenos y vídeos largos'},
  {k:'instagram', icon:'ig', t:'Instagram', s:'El día a día y las stories'},
  {k:'tiktok', icon:'tt', t:'TikTok', s:'Clips cortos'},
  {k:'web', icon:'web', t:'Web de BCULT', s:'Quiénes somos y cómo trabajamos'}
];

const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok = u => /^https:\/\//i.test(u);

document.getElementById('links').innerHTML = items.map(i => {
  if (i.sep) return '<p class="sep">' + i.sep + '</p>';
  const u = CONFIG[i.k] || '';
  const live = ok(u);
  return '<a class="l' + (i.main ? ' main' : '') + (live ? '' : ' off') + '" href="' + (live ? esc(u) : '#') + '"' +
    (live ? ' target="_blank" rel="noopener"' : ' aria-disabled="true"') + '>' + ic[i.icon] +
    '<span class="t"><strong>' + i.t + '</strong><span>' + (live ? i.s : 'Próximamente') + '</span></span><span class="go" aria-hidden="true">→</span></a>';
}).join('');
}
</script>
</body>
</html>
